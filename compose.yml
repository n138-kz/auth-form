services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docs:/var/www/html
      - ./container-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: ./container-php-build
      dockerfile: Dockerfile
    volumes:
      - ./docs:/var/www/html
