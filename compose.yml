services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docs:/var/www/html
      - ./container-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: ./container-php-build/Dockerfile
    volumes:
      - ./docs:/var/www/html
    environment:
      INTERNAL_DB_HOST: db
      INTERNAL_DB_PORT: 5432
      INTERNAL_DB_DATABASE: myapp
      INTERNAL_DB_USERNAME: postgres
      INTERNAL_DB_PASSWORD: password
      GOOGLE_RECAPTCHA_SITE_KEY: "${GOOGLE_RECAPTCHA_SITE_KEY:-null}"
      GOOGLE_RECAPTCHA_SECRET_KEY: "${GOOGLE_RECAPTCHA_SECRET_KEY:-null}"
      IPINFO_TOKEN: "${IPINFO_TOKEN:-null}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-null}"
      DISCORD_AUTHN_BOT_CLIENT_ID: "${DISCORD_AUTHN_BOT_CLIENT_ID:-null}"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
