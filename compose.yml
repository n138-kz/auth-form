services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docs:/var/www/html
      - ./container-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: ./container-php-build
      dockerfile: Dockerfile
    volumes:
      - ./docs:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: myapp
      DB_USERNAME: postgres
      DB_PASSWORD: password
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
