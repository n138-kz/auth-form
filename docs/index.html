	<script src="https://www.google.com/recaptcha/api.js?render=6LfCHdcUAAAAAOwkHsW_7W7MfoOrvoIw9CXdLRBA"></script>
	<script>
		class googleRecaptcha {
			constructor(sitekey) {
				this.client_id = sitekey;
			}
			init() {
				grecaptcha.execute(this.client_id, {action: 'user/register'}).then((token)=>{
					expire_at = {
						issued_at: new Date().getTime(),
						expire_at: new Date(new Date().getTime()+(5*60*1000)).getTime(),
						/* expire_at: 5min */
					}
					console.debug(expire_at);
					localStorage.setItem( (btoa(location.href)).slice(0, 16) + '.reCAPTCHA', {
						issued_at: expire_at.issued_at,
						expire_at: expire_at.expire_at,
						token: token,
					} );
				});
			}
			getToken() {
				const token = localStorage.getItem( (btoa(location.href)).slice(0, 16) + '.reCAPTCHA' );
				if( typeof token === 'undefined' ){
					return null;
				}
				if( typeof token === 'object' && token === null ){
					return null;
				}
				if( token.length == 0 ){
					return null;
				}
				return token;
			}
		}
		googleRecaptcha = new googleRecaptcha('6LfCHdcUAAAAAOwkHsW_7W7MfoOrvoIw9CXdLRBA');
		googleRecaptcha.init();
	</script>
	<link rel="stylesheet" href="./main.css">

<body>

				<script>
					const auth2discord = (e) => {
						if(typeof e === 'undefined') e = window.event.target.dataset;

						if(typeof e.provider === 'undefined') return false;
						if(typeof e.clientId === 'undefined') return false;
						if(typeof e.redirectUri === 'undefined') return false;
						if(typeof e.scope === 'undefined') return false;
						
						console.log(encodeURIComponent(e.redirectUri));
						console.log(e);
						console.log(localStorage.length);
						console.log(sessionStorage.length);
						console.log(grecaptcha_pickup());
						console.log(null);
						
						return false;
					};
				</script>
				<div class="text-center">
					<button
						data-provider="discord"
						data-client-id="1331215597119340585"
						data-redirect-uri="https://n138-kz.github.io/sso_discord/"
						data-scope="identify email"
						onclick="auth2discord()"
						style="
							width: 250px;
							height: 1.5em;
							font-size: 1.2em;
							vertical-align: middle;
							margin-top: 25px;
							margin-bottom: 25px;
						">Discord Login</button>
				</div>
			</div>
		</div>
